<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Khôi · Chọn giao diện // Access Portal</title>
<meta name="description" content="Chọn giao diện thiệp mời Lễ Tốt Nghiệp của Đoàn Minh Khôi — Công nghệ hoặc Cổ trang." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Ma+Shan+Zheng&family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00f6ff;
    --pink: #ff2bd6;
    --gold: #d8b774;
    --gold-bright: #f2dca6;
    --jade: #7fd7bd;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    min-height: 100svh;
    min-height: 100dvh;
    background: #05070c;
    color: #fff;
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* Intro prompt */
  .prompt {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 20;
    text-align: center;
    padding: clamp(1.2rem, 4vh, 2.4rem) 1.2rem 1rem;
    padding-top: max(1.2rem, env(safe-area-inset-top));
    pointer-events: none;
    background: linear-gradient(180deg, rgba(3,5,10,0.86), transparent);
  }
  .prompt .cn { font-family: 'Ma Shan Zheng', serif; color: var(--gold); font-size: clamp(1.1rem, 3.4vw, 1.6rem); letter-spacing: 3px; }
  .prompt h1 {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: clamp(1rem, 3.4vw, 1.5rem);
    letter-spacing: 1px;
    margin-top: 0.3rem;
    color: #eef3f6;
    text-shadow: 0 0 18px rgba(216,183,116,0.3);
  }
  .prompt p { margin-top: 0.35rem; font-size: clamp(0.72rem, 2.4vw, 0.9rem); color: #9fb0c0; letter-spacing: 1px; }

  /* Split stage */
  .stage { display: flex; height: 100vh; height: 100dvh; }
  @media (max-width: 720px) { .stage { flex-direction: column; } }

  .side {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    cursor: pointer;
    transition: flex 0.5s cubic-bezier(0.22,1,0.36,1), filter 0.4s ease;
    isolation: isolate;
  }
  .side::before {
    content: '';
    position: absolute; inset: 0; z-index: -2;
    transition: transform 0.6s ease, opacity 0.4s ease;
  }
  .side::after {
    content: '';
    position: absolute; inset: 0; z-index: -1;
    opacity: 0; transition: opacity 0.4s ease;
  }

  /* --- Tech side --- */
  .tech::before {
    background:
      radial-gradient(700px 400px at 50% 30%, rgba(0,246,255,0.14), transparent 60%),
      linear-gradient(160deg, #05070f, #0a1120 60%, #0a0a18);
  }
  .tech::after {
    background-image:
      linear-gradient(rgba(0,246,255,0.10) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,246,255,0.10) 1px, transparent 1px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 30%, transparent 75%);
    mask-image: radial-gradient(circle at 50% 45%, #000 30%, transparent 75%);
  }
  .tech .num { color: var(--cyan); text-shadow: 0 0 22px rgba(0,246,255,0.7); }
  .tech .label { font-family: 'Orbitron', sans-serif; color: #fff; text-shadow: 0 0 24px rgba(0,246,255,0.6), 0 0 44px rgba(255,43,214,0.3); }
  .tech .sub { color: var(--cyan); }
  .tech .go { border-color: var(--cyan); color: var(--cyan); }

  /* --- Xianxia side --- */
  .xianxia::before {
    background:
      radial-gradient(680px 420px at 50% 24%, rgba(216,183,116,0.16), transparent 62%),
      linear-gradient(180deg, #060a0e, #0b1116 60%, #12201d);
  }
  .xianxia .snow { position: absolute; inset: 0; z-index: -1; opacity: 0.9; }
  .xianxia .moon {
    position: absolute; top: 12%; right: 16%; width: 90px; height: 90px; border-radius: 50%; z-index: -1;
    background: radial-gradient(circle at 38% 36%, #fff, #eef2f5 55%, #cdd6dc);
    box-shadow: 0 0 46px 14px rgba(240,244,250,0.25);
  }
  .xianxia .kbg {
    position: absolute; z-index: -1; font-family: 'Ma Shan Zheng', serif;
    font-size: clamp(9rem, 26vw, 20rem); color: rgba(226,236,244,0.05); line-height: 1;
    top: 50%; left: 50%; transform: translate(-50%,-50%);
  }
  .xianxia .num { color: var(--gold-bright); text-shadow: 0 0 22px rgba(216,183,116,0.6); }
  .xianxia .label { font-family: 'Ma Shan Zheng', serif; color: var(--gold-bright); letter-spacing: 6px; text-shadow: 0 0 24px rgba(216,183,116,0.5); }
  .xianxia .sub { color: var(--jade); }
  .xianxia .go { border-color: var(--gold); color: var(--gold-bright); }

  /* Shared side content */
  .num { font-family: 'Orbitron', sans-serif; font-weight: 800; font-size: clamp(1.4rem, 4vw, 2rem); letter-spacing: 3px; margin-bottom: 0.6rem; opacity: 0.9; }
  .label { font-size: clamp(2.2rem, 7vw, 4.2rem); font-weight: 900; letter-spacing: 2px; }
  .sub { margin-top: 0.6rem; font-size: clamp(0.75rem, 2.6vw, 1rem); letter-spacing: 3px; text-transform: uppercase; }
  .go {
    margin-top: 1.8rem;
    display: inline-block;
    padding: 0.7rem 1.8rem;
    border: 1px solid;
    border-radius: 6px;
    font-family: 'Cinzel', serif;
    font-size: 0.78rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    transition: background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
  }

  /* Hover / focus emphasis (desktop) */
  @media (hover: hover) and (min-width: 721px) {
    .side:hover { flex: 1.35; }
    .stage:has(.tech:hover) .xianxia,
    .stage:has(.xianxia:hover) .tech { filter: brightness(0.5) saturate(0.7); }
    .side:hover::after { opacity: 1; }
    .tech:hover .go { background: var(--cyan); color: #04060d; box-shadow: 0 0 26px rgba(0,246,255,0.7); }
    .xianxia:hover .go { background: var(--gold-bright); color: #0a0d11; box-shadow: 0 0 26px rgba(216,183,116,0.6); }
  }
  .side:active { transform: scale(0.99); }

  /* Divider glow */
  .divider { position: fixed; z-index: 15; pointer-events: none; }
  @media (min-width: 721px) {
    .divider { top: 0; bottom: 0; left: 50%; width: 2px; transform: translateX(-1px);
      background: linear-gradient(180deg, transparent, rgba(216,183,116,0.5), rgba(0,246,255,0.5), transparent); }
  }
  @media (max-width: 720px) {
    .divider { left: 0; right: 0; top: 50%; height: 2px; transform: translateY(-1px);
      background: linear-gradient(90deg, transparent, rgba(0,246,255,0.5), rgba(216,183,116,0.5), transparent); }
  }

  /* Fade-out on choose */
  body.leaving { transition: opacity 0.5s ease; opacity: 0; }

  .foothint {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    text-align: center; padding: 0.9rem;
    padding-bottom: max(0.9rem, env(safe-area-inset-bottom));
    font-size: 0.72rem; letter-spacing: 2px; color: #6f7d85; pointer-events: none;
    background: linear-gradient(0deg, rgba(3,5,10,0.7), transparent);
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .side > .inner { animation: fadeUp 0.9s cubic-bezier(0.22,1,0.36,1) both; }
  .xianxia > .inner { animation-delay: 0.12s; }
</style>
</head>
<body>
  <div class="prompt">
    <div class="cn">請 選 一 界</div>
    <h1>Trước khi bắt đầu, mình có 2 loại giao diện — bạn hãy chọn:</h1>
    <p>Chạm để vào · tap a side to enter</p>
  </div>

  <div class="stage">
    <a class="side tech" href="tech.html" aria-label="Chọn giao diện Công nghệ">
      <div class="inner">
        <div class="num">// 01</div>
        <div class="label">CÔNG NGHỆ</div>
        <div class="sub">Cyberpunk · Neon · Tech</div>
        <span class="go">Vào cổng ▸</span>
      </div>
    </a>

    <a class="side xianxia" href="xianxia.html" aria-label="Chọn giao diện Cổ trang">
      <div class="moon" aria-hidden="true"></div>
      <div class="kbg" aria-hidden="true">仙</div>
      <canvas class="snow" aria-hidden="true"></canvas>
      <div class="inner">
        <div class="num">〇 02</div>
        <div class="label">CỔ TRANG</div>
        <div class="sub">Tiên hiệp · Tuyết · Ink</div>
        <span class="go">Nhập cảnh ▸</span>
      </div>
    </a>
  </div>

  <div class="divider" aria-hidden="true"></div>
  <div class="foothint">Đoàn Minh Khôi · Lễ Tốt Nghiệp · 09/08/2026</div>

  <script>
    // Smooth fade before navigating to the chosen interface.
    document.querySelectorAll('.side').forEach((a) => {
      a.addEventListener('click', (e) => {
        const href = a.getAttribute('href');
        if (!href) return;
        e.preventDefault();
        document.body.classList.add('leaving');
        setTimeout(() => { window.location.href = href; }, 460);
      });
    });

    // Tiny snow preview on the Cổ trang side.
    (function () {
      const canvas = document.querySelector('.xianxia .snow');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let w, h, flakes;
      const N = window.innerWidth < 720 ? 26 : 40;
      function resize() {
        const r = canvas.getBoundingClientRect();
        w = canvas.width = r.width; h = canvas.height = r.height;
        flakes = Array.from({ length: N }, () => spawn(true));
      }
      function spawn(any) {
        return { x: Math.random() * (w || 300), y: any ? Math.random() * (h || 300) : -6,
          r: 0.8 + Math.random() * 2.2, s: 0.3 + Math.random() * 1.0, d: Math.random() * Math.PI * 2 };
      }
      function step(t) {
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#eef4fa';
        for (const f of flakes) {
          f.y += f.s; f.x += Math.sin(t * 0.001 + f.d) * 0.4;
          if (f.y > h + 6) Object.assign(f, spawn(false));
          ctx.globalAlpha = 0.7;
          ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        if (!reduce) requestAnimationFrame(step);
      }
      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(step);
    })();
  </script>
</body>
</html>
